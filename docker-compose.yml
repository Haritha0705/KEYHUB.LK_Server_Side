services:
  server_side:
    image: keyhub_img:latest
    container_name: keyhubcontainer
    restart: always
    env_file:
      - .env.dev
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    container_name: keyhub_postgres
    restart: always
    env_file:
      - .env.dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata: